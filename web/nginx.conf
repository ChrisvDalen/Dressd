server {
    # 8080, not 80: the image runs as a non-root user, which cannot bind a
    # privileged port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline HTTP security headers. NOTE: nginx does not inherit these into a
    # location that defines its own add_header, so such locations repeat the set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The app is never meant to be embedded; a minimal CSP keeps this safe without
    # having to hash the app's assets.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Route API + media calls to the right service (same-origin, no CORS).
    location /api/scan     { proxy_pass http://wardrobe-service:8081; }
    location /api/garments { proxy_pass http://wardrobe-service:8081; }
    location /media        { proxy_pass http://wardrobe-service:8081; }
    location /api/avatars  { proxy_pass http://avatar-service:8082; }
    location /api/outfits  { proxy_pass http://outfit-composer-service:8083; }

    # Photos are up to 15MB (matching the wardrobe-service multipart limit);
    # nginx would otherwise reject them at its 1MB default.
    client_max_body_size 15m;

    # Container healthcheck target — served by nginx, no upstream involved.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable, but index.html must never be cached or
    # clients keep booting a stale app against a newer API.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # SPA fallback: everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
