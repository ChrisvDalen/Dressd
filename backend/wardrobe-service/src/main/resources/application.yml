server:
  port: 8081

spring:
  application:
    name: wardrobe-service
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  # Applies to the auto-configured RestClient used for the recognition hop. Using
  # Boot's builder (rather than a hand-rolled one) is what gets that call traced.
  http:
    client:
      connect-timeout: 3s
      read-timeout: 30s
  datasource:
    url: jdbc:h2:file:./data/wardrobe;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    # Each service owns its own schema, so a shared Postgres instance still keeps
    # the services independently migratable (see docs/ADR.md, ADR-007).
    schemas: wardrobe
    default-schema: wardrobe
    create-schemas: true
  jpa:
    # Flyway owns the schema; Hibernate only checks the mapping still matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: wardrobe
      hibernate.format_sql: false

dressd:
  auth:
    mode: DEV
  recognition:
    base-url: http://localhost:8000
    enabled: true
  storage:
    local:
      root: ./data/media
      public-base-url: /media
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dressd}
    username: ${DB_USER:dressd}
    password: ${DB_PASSWORD:dressd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# One JSON line per log event, so a collector can parse it without regexes.
logging:
  structured:
    format:
      console: ecs

dressd:
  auth:
    # Fails closed: TOKEN mode refuses to start without AUTH_SECRET, rather than
    # silently trusting a client-supplied X-Owner-Id header.
    mode: ${AUTH_MODE:TOKEN}
    secret: ${AUTH_SECRET:}
  recognition:
    base-url: ${RECOGNITION_URL:http://recognition-service:8000}
  storage:
    local:
      root: ${STORAGE_ROOT:/data/media}
      public-base-url: ${STORAGE_PUBLIC_URL:/media}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
