spring:
  datasource:
    url: jdbc:h2:mem:wardrobe;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  # Tests run the real migrations, so a broken migration fails the build rather
  # than production.
  flyway:
    enabled: true
    schemas: wardrobe
    default-schema: wardrobe
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: wardrobe

dressd:
  recognition:
    enabled: false
  storage:
    local:
      root: ./target/test-media
      public-base-url: /media
    # No background sweep competing with the tests over the same directory.
    pending-cleanup-enabled: false

management:
  tracing:
    enabled: false
