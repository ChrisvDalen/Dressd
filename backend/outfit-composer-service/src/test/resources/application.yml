spring:
  datasource:
    url: jdbc:h2:mem:outfit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  # Tests run the real migrations, so a broken migration fails the build rather
  # than production.
  flyway:
    enabled: true
    schemas: outfit
    default-schema: outfit
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: outfit

management:
  tracing:
    enabled: false
