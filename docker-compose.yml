# Dressd full-stack local orchestration.
#
# Brings up Postgres, the three Spring Boot services, the Python recognition
# sidecar, and the Angular web app behind nginx. The Java services run with the
# `prod` profile so they talk to Postgres instead of the dev H2 files.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dressd
      POSTGRES_USER: dressd
      POSTGRES_PASSWORD: dressd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dressd"]
      interval: 5s
      timeout: 5s
      retries: 10

  recognition-service:
    build: ./recognition-service
    ports:
      - "8000:8000"

  wardrobe-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: wardrobe-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/dressd
      DB_USER: dressd
      DB_PASSWORD: dressd
      RECOGNITION_URL: http://recognition-service:8000
      STORAGE_ROOT: /data/media
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    ports:
      - "8081:8081"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      recognition-service:
        condition: service_started

  avatar-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: avatar-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/dressd
      DB_USER: dressd
      DB_PASSWORD: dressd
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  outfit-composer-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: outfit-composer-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/dressd
      DB_USER: dressd
      DB_PASSWORD: dressd
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - wardrobe-service
      - avatar-service
      - outfit-composer-service

volumes:
  pgdata:
  media:
