# Dressd full-stack local orchestration.
#
# Brings up Postgres, the three Spring Boot services, the Python recognition
# sidecar, and the Angular web app behind nginx. The Java services run with the
# `prod` profile so they talk to Postgres instead of the dev H2 files.
#
# Credentials come from .env (see .env.example). Requires BuildKit, which is the
# default in current Docker, for the Maven cache mount in service.Dockerfile.
#
# NOTE ON AUTH: this stack runs with AUTH_MODE=DEV, which trusts the
# X-Owner-Id header and is unauthenticated by design — it is a local dev
# orchestration. A real deployment leaves AUTH_MODE unset so the `prod` profile's
# TOKEN default applies, and sets AUTH_SECRET. See docs/SECURITY.md.

x-service-env: &db-env
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dressd}
  DB_USER: ${POSTGRES_USER:-dressd}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-dressd}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
  AUTH_MODE: ${AUTH_MODE:-DEV}
  AUTH_SECRET: ${AUTH_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dressd}
      POSTGRES_USER: ${POSTGRES_USER:-dressd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dressd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dressd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  recognition-service:
    build: ./recognition-service
    ports:
      - "8000:8000"

  wardrobe-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: wardrobe-service
        SERVICE_PORT: 8081
    environment:
      <<: *db-env
      RECOGNITION_URL: http://recognition-service:8000
      STORAGE_ROOT: /data/media
    ports:
      - "8081:8081"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      # Waiting for healthy, not merely started: the first scan after `up` would
      # otherwise race a sidecar that has not finished booting.
      recognition-service:
        condition: service_healthy

  avatar-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: avatar-service
        SERVICE_PORT: 8082
    environment:
      <<: *db-env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  outfit-composer-service:
    build:
      context: ./backend
      dockerfile: service.Dockerfile
      args:
        SERVICE: outfit-composer-service
        SERVICE_PORT: 8083
    environment:
      <<: *db-env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    # The nginx image is unprivileged and listens on 8080; the published port is
    # unchanged, so http://localhost:8080 still serves the app.
    ports:
      - "8080:8080"
    depends_on:
      wardrobe-service:
        condition: service_healthy
      avatar-service:
        condition: service_healthy
      outfit-composer-service:
        condition: service_healthy

volumes:
  pgdata:
  media:
